<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>workproof og</title>
  <style>
    html, body { margin: 0; }
    .card {
      width: 1280px;
      height: 640px;
      background: radial-gradient(1200px 500px at 20% 20%, #1c1f27 0%, #0b0c10 55%);
      color: #f3ead7;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      gap: 56px;
      padding: 0 88px;
      box-sizing: border-box;
    }
    img.seal { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .kicker { letter-spacing: .18em; text-transform: uppercase; color: #c4a35a; font-size: 16px; margin: 0 0 12px; }
    h1 { margin: 0 0 16px; font-size: 88px; font-weight: 700; letter-spacing: -2px; color: #fff; }
    p { margin: 0; font-size: 28px; line-height: 1.4; color: #c6c9d0; max-width: 700px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="seal" src="logo.jpg" alt="" />
    <div>
      <p class="kicker">fail-closed verifier</p>
      <h1>workproof</h1>
      <p>After the agent finishes, prove the work actually happened.</p>
    </div>
  </div>
</body>
</html>
