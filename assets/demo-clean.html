<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>workproof clean</title>
  <style>
    html, body { margin: 0; background: #07080a; }
    .window {
      width: 920px;
      margin: 24px;
      background: #111318;
      border: 1px solid #2a2e36;
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      overflow: hidden;
      font-family: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #191c22;
      border-bottom: 1px solid #2a2e36;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .r { background: #ff5f57; }
    .y { background: #febc2e; }
    .g { background: #28c840; }
    .title { color: #8b909a; font-size: 12px; margin-left: 8px; }
    pre {
      margin: 0;
      padding: 22px 24px 26px;
      color: #e8eaed;
      font-size: 15px;
      line-height: 1.65;
    }
    .pass { color: #3dd68c; }
    .dim { color: #8b909a; }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">workproof — examples/clean</span>
    </div>
    <pre><span class="dim">$ node bin/workproof.js --workspace examples/clean</span>
<span class="pass">PASS</span> tests      1 passed
<span class="pass">PASS</span> diff       1 file matches claim
<span class="pass">PASS</span> screenshot png capture at shots/login.png
<span class="pass">PASS</span> receipt    wrote .workproof/receipt.json

workproof: 4/4 checks passed</pre>
  </div>
</body>
</html>
